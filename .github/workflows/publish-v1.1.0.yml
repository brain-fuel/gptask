name: Publish GoForge Task releases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.1.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.0 >/dev/null 2>&1 ||
            gh release create v1.1.0 \
              --verify-tag \
              --title "GoForge Task v1.1.0" \
              --generate-notes
          gh release view v1.1.1 >/dev/null 2>&1 ||
            gh release create v1.1.1 \
              --verify-tag \
              --title "GoForge Task v1.1.1" \
              --generate-notes
          gh release view v1.2.0 >/dev/null 2>&1 ||
            gh release create v1.2.0 \
              --verify-tag \
              --title "GoForge Task v1.2.0" \
              --generate-notes
